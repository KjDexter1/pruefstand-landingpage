name: Wochenlauf

# Montags 06:00 Berlin (04:00 UTC im Sommer). Erzeugt den Wochenbericht,
# committet ihn und legt ein Issue als Arbeitsliste fuer die Woche an.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  bericht:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bericht erzeugen
        id: bericht
        run: python3 ops/pruefstand.py bericht --woche

      - name: Bericht committen
        run: |
          git config user.name "Wochenlauf"
          git config user.email "actions@github.com"
          git add ops/berichte
          git diff --staged --quiet || git commit -m "Wochenbericht ${{ steps.bericht.outputs.titel }}"
          git push

      - name: Issue anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          TITEL: ${{ steps.bericht.outputs.titel }}
          PFAD: ${{ steps.bericht.outputs.pfad }}
        run: |
          gh issue create \
            --title "$TITEL" \
            --body-file "$PFAD" \
            --label wochenlauf \
            --repo "${{ github.repository }}" || \
          gh issue create --title "$TITEL" --body-file "$PFAD" --repo "${{ github.repository }}"
