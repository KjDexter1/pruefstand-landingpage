name: Musterbericht erzeugen

# Baut den gekennzeichneten Musterbericht aus den Beispieldaten des Projekts
# und legt ihn als herunterladbares Ergebnis an den Lauf.
#
# Bewusst NUR der Musterbericht: Echte Kundendaten dürfen nicht in dieses
# Repository. Sie stünden dauerhaft in der Versionsverwaltung, auch nach dem
# Löschen — das widerspräche der Zusage aus der Vertraulichkeitserklärung,
# digitale Kopien nach acht Wochen zu löschen. Echte Berichte werden lokal
# erzeugt, aus ~/pruefstand-daten.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  musterbericht:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Abhängigkeiten installieren
        working-directory: ops/bericht
        run: npm install --no-audit --no-fund
      - name: Musterbericht bauen
        working-directory: ops/bericht
        run: node erzeuge-bericht.js --beispiel --muster
      - name: Word-Datei bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: musterbericht
          path: ops/bericht/*.docx
          if-no-files-found: error
          retention-days: 7
